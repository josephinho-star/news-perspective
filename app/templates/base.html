<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Meridian{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css?v={{ static_version }}">
</head>
<body>
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("theme");
        if (saved === "dark") document.documentElement.dataset.theme = "dark";
      } catch (e) {}
    })();
  </script>
  {% block header %}
    <header class="masthead-simple">
      <a class="brand-small" href="/">MERIDIAN</a>
      <nav>
        <a href="/topics" class="btn">Follow topics</a>
        <form method="post" action="/refresh" style="display:inline">
          <button class="btn" type="submit">Refresh feed</button>
        </form>
        <button class="btn night-toggle" id="nightToggle" type="button">Night</button>
      </nav>
    </header>
  {% endblock %}
  <main>
    {% block content %}{% endblock %}
  </main>
  <script>
    (function () {
      var btn = document.getElementById("nightToggle");
      if (!btn) return;
      btn.addEventListener("click", function () {
        var root = document.documentElement;
        var isDark = root.dataset.theme === "dark";
        root.dataset.theme = isDark ? "light" : "dark";
        try { localStorage.setItem("theme", isDark ? "light" : "dark"); } catch (e) {}
      });
    })();
  </script>
</body>
</html>
